[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "f5-gtm-automation"
version = "0.1.0"
description = "F5 BIG-IP GTM automation service — provisions GSLB config and Infoblox CNAMEs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pyodbc>=5.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
    "freezegun>=1.5",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
