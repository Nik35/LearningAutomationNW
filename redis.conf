# Redis configuration for F5 GTM Automation Service
# Per implementation plan §2.1 and confirmed noeviction policy.
#
# CRITICAL: maxmemory-policy MUST be noeviction.
# Any allkeys-* policy silently deletes queued Celery tasks with no error.

# ── Memory ────────────────────────────────────────────────────────────────────
# Set to 60-70% of the container memory limit to leave headroom for:
#   - RDB snapshot fork (copy-on-write can transiently double RSS)
#   - AOF rewrite fork
#   - OS page cache
# Default 0 means unlimited → OOM kill risk. Uncomment and set before deploying.
# maxmemory 512mb

# MUST be noeviction. With this policy Redis returns an OOM error on write
# when full instead of silently evicting Celery task payloads.
maxmemory-policy noeviction

# ── Persistence ───────────────────────────────────────────────────────────────
# AOF for durability of queued tasks across restarts.
appendonly yes
appendfsync everysec

# RDB as a secondary safety net.
save 900 1
save 300 10
save 60 10000

# ── Replication (DC-B replica) ────────────────────────────────────────────────
# On the DC-B replica instance, uncomment and set:
# replicaof <dc-a-primary-host> 6379
# replica-read-only yes

# ── Security ──────────────────────────────────────────────────────────────────
# Bind to internal network interface only; adjust per OpenShift pod network.
# bind 127.0.0.1
# requirepass <set via OpenShift secret>

# ── Connection ────────────────────────────────────────────────────────────────
# Default 10000 max clients; leave at default unless monitoring shows limit hit.
# maxclients 10000

# ── Slow log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000   # 10ms — alert if Lua scripts take longer
slowlog-max-len 256
